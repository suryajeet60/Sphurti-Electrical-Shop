<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeedBack</title>
  <link rel="stylesheet" href="../css/FeedBack.css">
</head>

<body>
  <div class="container">
    <!-- Title section -->
    <div class="title"><h3>Give Your FeedBack</h3></div>
    <div class="content">
      <!-- feedback form -->
      <form action="#">
        <div class="user-details">

          <!-- Input for Full Name -->
          <div class="input-box">
            <span class="details"><h3>Name</h3></span>
            <input type="text" placeholder="Enter your name" required>
          </div>

          <!-- Input for Email -->
          <div class="input-box">
            <span class="details"><h3>Email</h3></span>
            <input type="text" placeholder="Enter your email" required>
          </div>
          
          <!-- Input for Phone Number -->
          <div class="input-box">
            <span class="details"><h3>Phone Number</h3></span>
            <input type="text" placeholder="Enter your number" required>
          </div>

          <div class="input-box" >
            <span class="details"><h3>Rating</h3></span>
            <div class="star-rating">
              <input type="radio" id="star5" name="rating" value="5">
              <label for="star5">&#9733;</label>
        
              <input type="radio" id="star4" name="rating" value="4">
              <label for="star4">&#9733;</label>
        
              <input type="radio" id="star3" name="rating" value="3">
              <label for="star3">&#9733;</label>
        
              <input type="radio" id="star2" name="rating" value="2">
              <label for="star2">&#9733;</label>
        
              <input type="radio" id="star1" name="rating" value="1">
              <label for="star1">&#9733;</label>
            </div>
          </div>

          <div class="input-box">
            <span class="details"><h3>Message</h3></span>
            <textarea placeholder="Explain Your Though...." rows="6" cols="90" required></textarea>
          </div>
        </div>

        <!-- Submit button -->
        <div class="button">
          <input type="submit" value="Send">
        </div>
      </form>
    </div>
  </div>
</body>
</html>
